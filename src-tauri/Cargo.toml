[package]
name = "sampokai-submission-builder"
version = "0.1.12"
description = "山歩会の学務提出書類をローカルで作成するWindowsアプリ"
authors = ["山歩会"]
edition = "2021"

[lib]
name = "sampokai_submission_builder_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
calamine = "0.30"
chardetng = "0.1"
csv = "1.3"
encoding_rs = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-process = "2.3.1"
tauri-plugin-updater = "2.10.1"
tempfile = "3"
thiserror = "2"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
sha2 = "0.10"
